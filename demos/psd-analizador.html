<!DOCTYPE html>
<html lang="es" style="background:#0a0a0a;color:#00ff00;font-family:monospace;">
<head>
    <meta charset="UTF-8">
    <title>PSD Analizador</title>
    <style>
        body{margin:0;padding:20px;background:#000;color:#0f0;}
        textarea{width:100%;height:200px;background:#111;color:#0f0;border:none;padding:10px;}
        button{background:#0a0a0a;color:#0f0;border:1px solid #0f0;padding:10px 20px;margin-top:10px;cursor:pointer;}
        button:hover{background:#111;}
        .output{margin-top:10px;background:#222;padding:10px;}
    </style>
</head>
<body>
    <h1>PSD Analizador</h1>
    <textarea id="inputText" placeholder="Pega el texto aquí..."></textarea>
    <br>
    <button id="analyzeBtn">Analizar con PSD</button>
    <div id="output" class="output"></div>

    <script>
        const wordsManipulation = ["última oportunidad", "manipulación", "fraude", "engaño"];
        const wordsLegitimate = ["injusticia", "agravio", "violación", "desigualdad"];
        function analyze() {
            const txt = document.getElementById('inputText').value.toLowerCase();
            let manip = wordsManipulation.some(w => txt.includes(w));
            let legit = wordsLegitimate.some(w => txt.includes(w));
            let output = '';
            if(manip && legit){output = 'Ambos tipos detectados.'}
            else if(manip){output = 'Detección: manipulación.'}
            else if(legit){output = 'Detección: agravio legítimo.'}
            else{output = 'No se detectó nada relevante.'}
            document.getElementById('output').innerText = output;
        }
        document.getElementById('analyzeBtn').addEventListener('click', analyze);
    </script>
</body>
</html>
